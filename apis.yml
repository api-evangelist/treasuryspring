aid: treasuryspring
name: TreasurySpring
description: >-
  TreasurySpring is a digital platform for institutional cash management that helps
  organisations holding large excess cash balances minimise risk, maximise return and
  optimise time by diversifying across secure counterparties via standardised Fixed
  Term Funds (FTFs). Its Public API (OpenAPI 3.1) gives an authorised user programmatic
  access to their entities, fund cells, obligor exposures, indications, subscriptions,
  holdings, tasks and a normalised event stream — the full FTF lifecycle from
  subscription to live holding — with OAuth 2.0 auth, offset and cursor pagination,
  webhooks, and a published, read-only Model Context Protocol (MCP) server for AI agents.
