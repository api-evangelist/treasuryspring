      - previousSubscriptionDate
      type: object
      x-tags:
      - Events
    SubscribedEvent:
      description: A new holding subscription was placed.
      properties:
        cost:
          description: Principal amount invested in the holding's currency.
          examples:
          - '10000.00'
          format: decimal
          type: string
        currency:
