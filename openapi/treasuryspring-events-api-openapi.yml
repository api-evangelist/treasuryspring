          - '10250.00'
          format: decimal
          type: string
        obligorExposureCode:
          description: Code identifying the obligor exposure (counterparty) for this holding.
          examples:
          - BACR
          type: string
        uid:
          description: Unique identifier for this event record.
          examples:
          - '00000000000000000000000000000001'
          type: string
        yield:
          description: Current yield for the holding at the time of the event (annualised APY).
          examples:
          - '4.000000'
          format: decimal
          type: string
      required:
      - uid
      - cursor
      - entityCode
      - obligorExposureCode
      - maturityValue
      - yield
      - eventType
      - currency
      - holdingUid
      - maturityDate
      - finalized
      type: object
      x-tags:
      - Events
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
